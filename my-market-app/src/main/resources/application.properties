spring.application.name=my-market-app

server.port=8080

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:market_db}
spring.r2dbc.username=${DB_USERNAME:gpay}
spring.r2dbc.password=${DB_PASSWORD:gpay}

spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=10
spring.r2dbc.pool.max-idle-time=30s
spring.r2dbc.pool.validation-depth=local

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

market.cache.ttl=${MARKET_CACHE_TTL:120s}
market.cart.ttl=${MARKET_CART_TTL:30m}

payment.service.base-url=${PAYMENT_SERVICE_URL:http://localhost:8081}
payment.service.timeout=30s

spring.security.oauth2.client.registration.payment-service.client-id=${MARKET_APP_CLIENT_ID:market-app-client}
spring.security.oauth2.client.registration.payment-service.client-secret=${MARKET_APP_CLIENT_SECRET:market-app-secret}
spring.security.oauth2.client.registration.payment-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.payment-service.scope=payment.access
spring.security.oauth2.client.provider.payment-service.token-uri=${AUTH_SERVER_ISSUER_URI:http://localhost:9000}/oauth2/token

