openapi: 3.0.3
info:
  title: Payment Service API
  description: >
    RESTful API сервиса платежей для интеграции с витриной интернет-магазина
    "my-market-app". Используется для проверки баланса счёта и списания
    средств при оформлении заказа.
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Локальный запуск сервиса платежей
tags:
  - name: payments
    description: Операции с балансом и платежами
paths:
  /api/v1/payments/balance:
    get:
      tags:
        - payments
      operationId: getBalance
      summary: Получить текущий баланс счёта
      responses:
        '200':
          description: Текущий баланс успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
  /api/v1/payments:
    post:
      tags:
        - payments
      operationId: makePayment
      summary: Списать сумму заказа с баланса счёта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: >
            Результат обработки платежа. При недостаточном балансе
            платёж считается неуспешным (success=false), при этом код
            ответа остаётся 200 — статус операции нужно проверять по полю
            success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Некорректные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    BalanceResponse:
      type: object
      required:
        - balance
      properties:
        balance:
          type: integer
          format: int64
          description: Текущий баланс счёта в копейках/рублях (целое число)
          example: 100000
    PaymentRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Сумма к списанию
          example: 4500
    PaymentResponse:
      type: object
      required:
        - success
        - balance
      properties:
        success:
          type: boolean
          description: Признак успешного списания средств
          example: true
        balance:
          type: integer
          format: int64
          description: Баланс счёта после обработки платежа
          example: 95500
        message:
          type: string
          description: Пояснение к результату операции
          example: Payment successful
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: amount must be greater than 0
